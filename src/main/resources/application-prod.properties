# =====================================================
# APPLICATION
# =====================================================
spring.application.name=Verbrix


# =====================================================
# SERVER
# =====================================================
server.port=${PORT:8080}
spring.jmx.enabled=false
# AOT is good for startup, keep it
spring.aot.enabled=true 
# Explicitly load everything at startup (Eager Init)
spring.main.lazy-initialization=false


# =====================================================
# DATABASE ? POSTGRESQL (PROD)
# =====================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Connection Pool (HikariCP) - Tuned for Render Free Tier
spring.datasource.hikari.pool-name=VerbrixPool
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-test-query=SELECT 1
# INCREASED: Give the slow CPU 60 seconds to connect before giving up
spring.datasource.hikari.connection-timeout=60000 
spring.datasource.hikari.validation-timeout=3000


# =====================================================
# MONGODB (PROD)
# =====================================================
spring.data.mongodb.uri=${SPRING_MONGODB_URI}
spring.data.mongodb.database=${SPRING_MONGODB_DATABASE}


# =====================================================
# JPA / HIBERNATE (PROD)
# =====================================================
# Keeps schema in sync with Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Disable SQL init & dev helpers
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


# =====================================================
# LOGGING (PROD)
# =====================================================
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO


# =====================================================
# FILE UPLOAD / MULTIPART (PROD)
# =====================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=0


# =====================================================
# FILE STORAGE (PROD ? VOLUMES / DISK)
# =====================================================
storage.location.profile-pics=${STORAGE_PROFILE_PICS}
storage.location.certificates=${STORAGE_CERTIFICATES}
storage.location.videos=${STORAGE_VIDEOS}
storage.location.ids=${STORAGE_IDS}


# =====================================================
# SECURITY ? JWT (PROD)
# =====================================================
spring.app.jwtSecret=${VERBRIX_APP_JWTSECRET}
spring.app.jwtAccessExpirationMs=900000
spring.app.jwtRefreshExpirationMs=604800000

app.cookie.domain=.verbrix.raihanalam.dev
app.cookie.secure=true

server.forward-headers-strategy=framework

# =====================================================
# CORS (PROD)
# =====================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}


# =====================================================
# EMAIL / NOTIFICATIONS (RESEND ? PROD)
# =====================================================
spring.app.mail.from-address=${SPRING_APP_MAIL_FROM_ADDRESS}
spring.app.mail.from-name=Verbrix
resend.api.key=${RESEND_API_KEY}


# =====================================================
# RAZORPAY (PROD ? LIVE)
# =====================================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}


# =====================================================
# LIVEKIT (PROD)
# =====================================================
livekit.api-key=${LIVEKIT_API_KEY}
livekit.api-secret=${LIVEKIT_API_SECRET}
livekit.url=${LIVEKIT_URL}


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


server.servlet.session.cookie.same-site=none
