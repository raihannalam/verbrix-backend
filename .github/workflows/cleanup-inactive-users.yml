name: Cleanup maintenance

on:
  schedule:
    - cron: "0 0 * * *"   # runs once daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Cleanup Endpoints
        run: |
          echo "Cleaning up users..."
          curl -f -X POST https://api.verbrix.com/internal/cleanup/users \
          -H "X-MAINTENANCE-KEY: ${{ secrets.MAINTENANCE_KEY }}"

          echo "Cleaning up orphaned files..."
          curl -f -X POST https://api.verbrix.com/internal/cleanup/files \
          -H "X-MAINTENANCE-KEY: ${{ secrets.MAINTENANCE_KEY }}"
