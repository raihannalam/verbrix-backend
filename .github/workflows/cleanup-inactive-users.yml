name: Cleanup maintenance

on:
  schedule:
    - cron: "0 0 * * *" # Every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify maintenance secret
        shell: bash
        run: |
          if [ -z "${{ secrets.MAINTENANCE_KEY }}" ]; then
            echo "::error::GitHub secret MAINTENANCE_KEY is not configured."
            exit 1
          fi

          echo "✓ MAINTENANCE_KEY secret exists."

      - name: Cleanup inactive users
        shell: bash
        run: |
          echo "=== Cleaning up inactive users ==="

          curl --request POST \
            --verbose \
            --fail-with-body \
            --show-error \
            --location \
            --header "X-MAINTENANCE-KEY: ${{ secrets.MAINTENANCE_KEY }}" \
            https://api.verbrix.raihanalam.dev/internal/cleanup/users

      - name: Cleanup orphaned files
        shell: bash
        run: |
          echo "=== Cleaning up orphaned files ==="

          curl --request POST \
            --verbose \
            --fail-with-body \
            --show-error \
            --location \
            --header "X-MAINTENANCE-KEY: ${{ secrets.MAINTENANCE_KEY }}" \
            https://api.verbrix.raihanalam.dev/internal/cleanup/files

      - name: Finished
        run: echo "Maintenance completed successfully."
